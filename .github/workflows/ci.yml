name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Só para o prisma generate resolver a configuração; nenhuma conexão é aberta.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      - run: pnpm --filter backend exec tsc --noEmit
      - run: pnpm --filter backend build
      - run: pnpm --filter backend test -- --ci

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backoffice, barbershop, client]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.app }} exec tsc --noEmit
